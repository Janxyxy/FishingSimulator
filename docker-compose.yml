services:
  express:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:	
      - db
    restart: always  # Auto-restart Express service
  db:
    image: mariadb
    restart: always
    volumes:
      - ./db:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    env_file:
      - .env

  adminer:
    image: adminer
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"


